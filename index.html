<style>
  /* 1. Mood Filter UI */
  .mood-bar { display: flex; gap: 8px; padding: 10px 16px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); overflow-x: auto; }
  .mood-chip { padding: 4px 12px; border-radius: 15px; border: 1px solid var(--border-color); font-size: 12px; cursor: pointer; white-space: nowrap; }
  .mood-chip.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }

  /* 2. Audio Caption Bar */
  .voice-caption { display: flex; align-items: center; gap: 8px; background: var(--bg-color); padding: 8px 12px; border-radius: 20px; margin: 8px 16px; font-size: 12px; }
  .voice-play-btn { background: var(--primary-color); color: #fff; border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; }

  /* 3. Anti-Doomscroll Floating Reminder */
  .wellbeing-banner { background: #ff9800; color: #fff; text-align: center; padding: 8px; font-size: 12px; font-weight: bold; display: none; }

  /* 4. Time Capsule Post Tag */
  .capsule-badge { background: #9c27b0; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 6px; }
</style>

<div class="wellbeing-banner" id="doomscrollBanner">
  ⏰ Kamu sudah scrolling selama 15 menit. Istirahatkan matamu sejenak!
</div>

<div class="mood-bar">
  <div class="mood-chip active" onclick="filterMood('all', this)">🌀 Semua</div>
  <div class="mood-chip" onclick="filterMood('relax', this)">☕ Santai</div>
  <div class="mood-chip" onclick="filterMood('learn', this)">💡 Edukasi</div>
  <div class="mood-chip" onclick="filterMood('humor', this)">😂 Lucu</div>
</div>

<script>
  // 1. FILTER FEED BERDASARKAN SUASANA HATI (MOOD FEED)
  function filterMood(mood, chip) {
    document.querySelectorAll('.mood-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    
    const posts = document.querySelectorAll('.post-card');
    posts.forEach(post => {
      if (mood === 'all' || post.dataset.mood === mood) {
        post.style.display = 'block';
      } else {
        post.style.display = 'none';
      }
    });
    showToast(`Menampilkan feed kategori: ${chip.innerText}`);
  }

  // 2. TIMEOUT SYSTEM (ANTI-DOOMSCROLLING REMINDER)
  let scrollTime = 0;
  setInterval(() => {
    scrollTime += 1;
    if (scrollTime >= 15) { // Muncul setiap 15 unit waktu/menit
      document.getElementById('doomscrollBanner').style.display = 'block';
    }
  }, 60000); // Evaluasi berkala

  // 3. CAPTION SUARA (VOICE CAPTION SIMULATION)
  function playVoiceCaption(btn) {
    if (btn.innerText === '▶') {
      btn.innerText = '⏸';
      showToast("Memutar Voice Caption (0:15)...");
      setTimeout(() => { btn.innerText = '▶'; }, 3000);
    } else {
      btn.innerText = '▶';
    }
  }

  // 4. CAPSULE POST UNLOCK CHECKER
  function checkCapsulePost(card, unlockYear) {
    const currentYear = new Date().getFullYear();
    if (currentYear < unlockYear) {
      card.querySelector('.post-media').innerText = `🔒 Terkunci hingga tahun ${unlockYear}`;
    }
  }
</script>
