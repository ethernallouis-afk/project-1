<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Clone UI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #fafafa; color: #262626; }

    /* Top Navigation Bar */
    .navbar { background: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 10px 15%; border-bottom: 1px solid #dbdbdb; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 24px; font-weight: 700; font-family: 'Grand Hotel', cursive, sans-serif; letter-spacing: 1px; }
    .search-bar input { padding: 7px 16px; border: 1px solid #dbdbdb; background: #fafafa; border-radius: 8px; outline: none; width: 220px; font-size: 14px; text-align: center; }
    .search-bar input:focus { text-align: left; background: #fff; }
    .nav-icons { display: flex; gap: 20px; align-items: center; }
    .nav-icons button { background: none; border: none; font-size: 20px; cursor: pointer; color: #262626; }

    /* Main Grid Layout */
    .container { display: flex; max-width: 935px; margin: 30px auto; gap: 32px; padding: 0 20px; }
    .main-content { flex: 2; max-width: 614px; }
    .sidebar-right { flex: 1; display: none; }

    @media (min-width: 1000px) { .sidebar-right { display: block; } }

    /* Stories Section */
    .stories-container { background: #fff; border: 1px solid #dbdbdb; border-radius: 8px; padding: 16px 10px; margin-bottom: 24px; display: flex; gap: 15px; overflow-x: auto; }
    .story-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 66px; }
    .story-avatar-ring { width: 62px; height: 62px; border-radius: 50%; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); padding: 2px; display: flex; align-items: center; justify-content: center; }
    .story-avatar { width: 56px; height: 56px; border-radius: 50%; background: #007bff; color: #fff; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; font-weight: bold; }
    .story-username { font-size: 12px; margin-top: 4px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 60px; }

    /* Post Card */
    .post-card { background: #fff; border: 1px solid #dbdbdb; border-radius: 8px; margin-bottom: 24px; }
    .post-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
    .post-header-left { display: flex; align-items: center; gap: 10px; }
    .avatar-sm { width: 32px; height: 32px; border-radius: 50%; background: #007bff; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; }
    .username { font-size: 14px; font-weight: 600; cursor: pointer; }
    .post-options { background: none; border: none; font-weight: bold; cursor: pointer; }

    .post-media { width: 100%; max-height: 500px; background: #000; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: bold; }

    /* Post Actions & Interactions */
    .post-action-bar { padding: 10px 16px; display: flex; justify-content: space-between; }
    .left-actions { display: flex; gap: 16px; }
    .action-btn { background: none; border: none; font-size: 22px; cursor: pointer; transition: transform 0.1s ease; }
    .action-btn:active { transform: scale(1.2); }
    .action-btn.liked { color: #ed4956; }
    .action-btn.saved { color: #000; }

    .post-likes { padding: 0 16px; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .post-caption { padding: 0 16px; font-size: 14px; line-height: 1.4; margin-bottom: 8px; }
    .post-caption span { font-weight: 600; margin-right: 6px; }
    
    .comment-list { padding: 0 16px; font-size: 13px; color: #262626; margin-bottom: 8px; }
    .comment-item { margin-top: 4px; }
    .comment-item span { font-weight: 600; margin-right: 6px; }

    .post-time { padding: 0 16px; font-size: 10px; color: #8e8e8e; text-transform: uppercase; margin-bottom: 12px; }

    /* Comment Form Input */
    .comment-form { display: flex; border-top: 1px solid #efefef; padding: 10px 16px; align-items: center; }
    .comment-form input { flex: 1; border: none; outline: none; font-size: 14px; }
    .btn-submit-comment { background: none; border: none; color: #0095f6; font-weight: 600; cursor: pointer; opacity: 0.6; }
    .btn-submit-comment.active { opacity: 1; }

    /* Sidebar Right (Suggestions) */
    .user-profile-summary { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .user-profile-summary .avatar-md { width: 56px; height: 56px; border-radius: 50%; background: #262626; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .sidebar-header { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: #8e8e8e; margin-bottom: 12px; }
    .suggestion-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .suggestion-info { display: flex; align-items: center; gap: 10px; }
    .btn-follow { background: none; border: none; color: #0095f6; font-size: 12px; font-weight: 600; cursor: pointer; }
  </style>
</head>
