<script>
    // State Variables
    let isLiked = false;
    let likeCounter = 1240;
    let isSaved = false;

    // --- 1. FITUR LIKE & DOUBLE TAP ---
    function toggleLike() {
      const likeBtn = document.getElementById('likeBtn');
      const likeCountElem = document.getElementById('likeCount');

      isLiked = !isLiked;
      if (isLiked) {
        likeBtn.innerText = '❤️';
        likeBtn.classList.add('liked');
        likeCounter++;
      } else {
        likeBtn.innerText = '🤍';
        likeBtn.classList.remove('liked');
        likeCounter--;
      }
      likeCountElem.innerText = likeCounter.toLocaleString('id-ID');
    }

    // Double-click pada gambar postingan untuk like
    const postMedia = document.querySelector('.post-media');
    if (postMedia) {
      postMedia.addEventListener('dblclick', () => {
        if (!isLiked) toggleLike();
      });
    }

    // --- 2. FITUR BOOKMARK / SAVE ---
    function toggleSave() {
      const saveBtn = document.getElementById('saveBtn');
      isSaved = !isSaved;
      saveBtn.innerText = isSaved ? '🏷️' : '🔖';
    }

    // --- 3. FITUR KOMENTAR REAL-TIME ---
    function focusComment() {
      document.getElementById('commentInput').focus();
    }

    function checkCommentInput() {
      const input = document.getElementById('commentInput');
      const btn = document.getElementById('submitCommentBtn');
      btn.disabled = input.value.trim().length === 0;
      btn.classList.toggle('active', !btn.disabled);
    }

    function addComment(event) {
      event.preventDefault();
      const input = document.getElementById('commentInput');
      const commentList = document.getElementById('commentList');

      if (input.value.trim() === '') return;

      const newComment = document.createElement('div');
      newComment.className = 'comment-item';
      newComment.innerHTML = `<span>my_account</span>${escapeHTML(input.value)}`;
      
      commentList.appendChild(newComment);
      input.value = '';
      checkCommentInput();
    }

    // Sanitisasi Input Komentar (Keamanan XSS)
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // --- 4. FITUR PENCARIAN REAL-TIME ---
    const searchInput = document.querySelector('.search-bar input');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const suggestions = document.querySelectorAll('.suggestion-item');

        suggestions.forEach(item => {
          const username = item.querySelector('.username').innerText.toLowerCase();
          item.style.display = username.includes(query) ? 'flex' : 'none';
        });
      });
    }

    // --- 5. FITUR FOLLOW / UNFOLLOW SIDEBAR ---
    const followButtons = document.querySelectorAll('.btn-follow');
    followButtons.forEach(btn => {
      btn.addEventListener('click', function() {
        if (this.innerText === 'Ikuti') {
          this.innerText = 'Mengikuti';
          this.style.color = '#262626';
        } else {
          this.innerText = 'Ikuti';
          this.style.color = '#0095f6';
        }
      });
    });
  </script>
