
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Clone</title>
  <style>
    :root {
      --bg-color: #fafafa;
      --card-bg: #ffffff;
      --text-color: #262626;
      --border-color: #dbdbdb;
      --subtext-color: #8e8e8e;
      --primary-color: #0095f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 60px; }

    /* Navbar */
    .navbar { background: var(--card-bg); display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 22px; font-weight: bold; font-family: cursive; cursor: pointer; }
    .nav-icons { display: flex; gap: 15px; align-items: center; }
    .nav-icons button { background: none; border: none; font-size: 20px; cursor: pointer; }

    /* Container Utama */
    .container { max-width: 600px; margin: 20px auto; padding: 0 10px; }

    /* Stories Bar */
    .stories-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; display: flex; gap: 15px; overflow-x: auto; margin-bottom: 20px; }
    .story-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .story-avatar { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #ff0055; padding: 2px; object-fit: cover; }
    .story-name { font-size: 11px; margin-top: 4px; color: var(--text-color); width: 60px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Post Card */
    .post-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 20px; }
    .post-header { display: flex; align-items: center; gap: 10px; padding: 12px; }
    .avatar-sm { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #ddd; }
    .post-username { font-size: 13px; font-weight: 600; }
    
    .post-media { width: 100%; max-height: 500px; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .post-media img, .post-media video { width: 100%; max-height: 500px; object-fit: cover; }
    
    .post-actions { padding: 10px 12px; display: flex; gap: 12px; }
    .action-btn { background: none; border: none; font-size: 22px; cursor: pointer; }
    
    .post-likes { padding: 0 12px; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .post-caption { padding: 0 12px; font-size: 13px; margin-bottom: 8px; }
    .post-caption span { font-weight: 600; margin-right: 5px; }
    
    .comment-list { padding: 0 12px; font-size: 12px; margin-bottom: 6px; color: var(--subtext-color); }
    .comment-form { display: flex; border-top: 1px solid var(--border-color); padding: 10px 12px; }
    .comment-form input { flex: 1; border: none; outline: none; font-size: 13px; background: transparent; }
    .btn-comment { background: none; border: none; color: var(--primary-color); font-weight: 600; cursor: pointer; }

    /* Modal Form */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card-bg); width: 350px; padding: 20px; border-radius: 10px; }
    .modal-content input, .modal-content textarea { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid var(--border-color); border-radius: 4px; font-size: 13px; }
    .modal-content button { width: 100%; background: var(--primary-color); color: white; border: none; padding: 8px; border-radius: 4px; font-weight: 600; cursor: pointer; margin-top: 10px; }

    /* Toast Notification */
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 8px 16px; border-radius: 20px; font-size: 12px; display: none; z-index: 2000; }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="logo">Instagram</div>
    <div class="nav-icons">
      <button title="Buat Postingan" onclick="openModal('postModal')">➕</button>
      <button title="Profil" onclick="showToast('Halaman Profil Anda')">👤</button>
    </div>
  </div>

  <div class="container">
    
    <div class="stories-container" id="storiesList">
      <div class="story-item">
        <img class="story-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Story">
        <span class="story-name">clarissa</span>
      </div>
      <div class="story-item">
        <img class="story-avatar" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150" alt="Story">
        <span class="story-name">dimas_p</span>
      </div>
      <div class="story-item">
        <img class="story-avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150" alt="Story">
        <span class="story-name">siti_a</span>
      </div>
    </div>

    <div id="feedContainer">
      <div class="post-card">
        <div class="post-header">
          <img class="avatar-sm" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Avatar">
          <span class="post-username">clarissa</span>
        </div>
        <div class="post-media">
          <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600" alt="Post Image">
        </div>
        <div class="post-actions">
          <button class="action-btn" onclick="toggleLike(this)">🤍</button>
          <button class="action-btn">💬</button>
          <button class="action-btn">✈️</button>
        </div>
        <div class="post-likes"><span>1,245</span> suka</div>
        <div class="post-caption"><span>clarissa</span> Menikmati senja di pantai hari ini 🌅✨</div>
        <div class="comment-list"></div>
        <form class="comment-form" onsubmit="addComment(event, this)">
          <input type="text" placeholder="Tambahkan komentar...">
          <button type="submit" class="btn-comment">Kirim</button>
        </form>
      </div>
    </div>

  </div>

  <div class="modal" id="postModal">
    <div class="modal-content">
      <h3>Buat Postingan Baru</h3>
      <input type="text" id="inputUsername" placeholder="Nama Akun Anda" value="pengguna_baru">
      <input type="text" id="inputImgUrl" placeholder="URL Gambar (Contoh: https://...)">
      <textarea id="inputCaption" placeholder="Tulis caption..."></textarea>
      <button onclick="createNewPost()">Bagikan</button>
      <button style="background:#8e8e8e; margin-top:5px;" onclick="closeModal('postModal')">Batal</button>
    </div>
  </div>

  <div class="toast" id="toastMsg">Notifikasi</div>

  <script>
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function showToast(text) {
      const toast = document.getElementById('toastMsg');
      toast.innerText = text;
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 2000);
    }

    function toggleLike(btn) {
      if(btn.innerText === '🤍') {
        btn.innerText = '❤️';
      } else {
        btn.innerText = '🤍';
      }
    }

    function createNewPost() {
      const username = document.getElementById('inputUsername').value || 'pengguna';
      const imgUrl = document.getElementById('inputImgUrl').value;
      const caption = document.getElementById('inputCaption').value;

      if (!imgUrl) {
        showToast('Mohon masukkan URL gambar!');
        return;
      }

      const feed = document.getElementById('feedContainer');
      const postCard = document.createElement('div');
      postCard.className = 'post-card';
      postCard.innerHTML = `
        <div class="post-header">
          <img class="avatar-sm" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" alt="Avatar">
          <span class="post-username">${username}</span>
        </div>
        <div class="post-media">
          <img src="${imgUrl}" alt="Post Image">
        </div>
        <div class="post-actions">
          <button class="action-btn" onclick="toggleLike(this)">🤍</button>
          <button class="action-btn">💬</button>
          <button class="action-btn">✈️</button>
        </div>
        <div class="post-likes"><span>1</span> suka</div>
        <div class="post-caption"><span>${username}</span> ${caption}</div>
        <div class="comment-list"></div>
        <form class="comment-form" onsubmit="addComment(event, this)">
          <input type="text" placeholder="Tambahkan komentar...">
          <button type="submit" class="btn-comment">Kirim</button>
        </form>
      `;

      feed.prepend(postCard);
      closeModal('postModal');
      showToast('Postingan berhasil dibagikan!');
      
      // Reset form
      document.getElementById('inputImgUrl').value = '';
      document.getElementById('inputCaption').value = '';
    }

    function addComment(e, form) {
      e.preventDefault();
      const input = form.querySelector('input');
      const commentList = form.closest('.post-card').querySelector('.comment-list');
      
      if (!input.value.trim()) return;

      const commentItem = document.createElement('div');
      commentItem.innerHTML = `<strong>anda</strong> ${input.value}`;
      commentList.appendChild(commentItem);
      input.value = '';
    }
  </script>
</body>
</html>
